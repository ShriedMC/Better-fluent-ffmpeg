name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / FFmpeg ${{ matrix.ffmpeg }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        ffmpeg: [system]
        include:
          - node: 24
            ffmpeg: '8.1.3'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install tools
        run: |
          npm install --global yarn@1.22.22
          sudo apt-get update
          sudo apt-get install --yes ffmpeg flvmeta libmp3lame-dev libx264-dev zlib1g-dev
      - name: Build FFmpeg 8.1.3
        if: matrix.ffmpeg == '8.1.3'
        run: |
          bash tools/build-test-ffmpeg.sh "$RUNNER_TEMP/ffmpeg8"
          echo "$RUNNER_TEMP/ffmpeg8/bin" >> "$GITHUB_PATH"
      - name: Show runtime versions
        run: |
          node --version
          yarn --version
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run tests
        run: yarn test
      - name: Generate coverage report
        run: yarn coverage
      - name: Build documentation
        run: yarn docs
      - name: Validate package contents
        run: node tools/check-package.js
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-node-${{ matrix.node }}-ffmpeg-${{ matrix.ffmpeg }}
          path: coverage/lcov.info
